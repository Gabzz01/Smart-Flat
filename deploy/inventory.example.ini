# Copy to deploy/inventory.ini (gitignored) and point it at your Pi.
#
# After the first run the Pi is on the tailnet, so address it by its MagicDNS name and every later
# deploy works from anywhere. The first run has to reach it some other way -- over the LAN, or on a
# keyboard -- and needs an auth key:
#
#   ansible-playbook -i deploy/inventory.ini deploy/matter-bridge.yaml \
#     -e tailscale_authkey=tskey-auth-... -e bridge_env_file=.env

[matter_bridge]
pi ansible_user=raspberry
# First run, before the Pi is on the tailnet:
# pi.local ansible_user=raspberry
