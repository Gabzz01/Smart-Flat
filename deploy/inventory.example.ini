# Copy to deploy/inventory.ini (gitignored) and point it at your Pi.
#
# The Pi is reached over Tailscale, so this is its MagicDNS name and deploys work from anywhere.
# The play assumes the Pi is already on the tailnet; it does not install or configure Tailscale.

[matter_bridge]
# ansible_python_interpreter pins the interpreter Ansible would otherwise discover, and warn about.
pi ansible_user=raspberry ansible_python_interpreter=/usr/bin/python3
